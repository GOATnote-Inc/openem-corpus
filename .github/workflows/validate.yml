name: Schema Validation

permissions:
  contents: read

on:
  push:
    paths:
      - "corpus/**/*.md"
      - "schemas/**"
      - "scripts/validate.py"
      - "scripts/check_index_freshness.py"
      - "scripts/check_doc_counts.py"
      - "README.md"
  pull_request:
    paths:
      - "corpus/**/*.md"
      - "schemas/**"
      - "scripts/validate.py"
      - "scripts/check_index_freshness.py"
      - "scripts/check_doc_counts.py"
      - "README.md"

jobs:
  validate:
    name: Validate corpus schema
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v4

      - name: Set up Python 3.12
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install pyyaml

      - name: Run schema validation
        run: python scripts/validate.py

      - name: Check doc counts
        run: python scripts/check_doc_counts.py

      - name: Check index freshness
        run: python scripts/check_index_freshness.py
        continue-on-error: true  # Index (data/index/) is gitignored; freshness check is advisory in CI
