name: Audit and Diversity

permissions:
  contents: read

on:
  push:
    paths:
      - "corpus/**"
  pull_request:
    paths:
      - "corpus/**"

jobs:
  audit:
    name: Audit and diversity metrics
    runs-on: ubuntu-latest
    # Blocking checks (cross-file dosing, dose range, content completeness)
    # cause exit 1; remaining checks are informational.

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v4

      - name: Set up Python 3.12
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install pyyaml

      - name: Run audit
        run: python scripts/audit.py > audit-report.json

      - name: Run diversity metrics
        run: |
          if [ -f scripts/diversity_metrics.py ]; then
            python scripts/diversity_metrics.py > diversity-report.json
          else
            echo "diversity_metrics.py not yet implemented" > diversity-report.json
          fi

      - name: Upload audit report
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: audit-report
          path: audit-report.json
          retention-days: 30

      - name: Upload diversity report
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: diversity-report
          path: diversity-report.json
          retention-days: 30
