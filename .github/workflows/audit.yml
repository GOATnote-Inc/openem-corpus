name: Audit and Diversity

permissions:
  contents: read

on:
  push:
    paths:
      - "corpus/**"
  pull_request:
    paths:
      - "corpus/**"

jobs:
  audit:
    name: Audit and diversity metrics
    runs-on: ubuntu-latest
    # Blocking checks (cross-file dosing, dose range, content completeness)
    # cause exit 1; remaining checks are informational.

    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Set up Python 3.12
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install pyyaml

      - name: Run audit
        run: python scripts/audit.py > audit-report.json

      - name: Run diversity metrics
        run: |
          if [ -f scripts/diversity_metrics.py ]; then
            python scripts/diversity_metrics.py > diversity-report.json
          else
            echo "diversity_metrics.py not yet implemented" > diversity-report.json
          fi

      - name: Upload audit report
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: audit-report
          path: audit-report.json
          retention-days: 30

      - name: Upload diversity report
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: diversity-report
          path: diversity-report.json
          retention-days: 30
